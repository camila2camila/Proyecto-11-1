events:()=>`${pageHead('VIDA INSTITUCIONAL','Eventos y encuentros','Espacios para conectar promociones, compartir experiencias y fortalecer la comunidad.','<button class="btn primary" onclick="openEventForm()">＋ Crear evento</button>')}<div class="grid two-col">${events.map((e,i)=>`<div class="card survey-card"><div style="display:flex;gap:13px;align-items:flex-start"><div class="event-date"><b>${e.day}</b><small>${e.month}</small></div><div><h3>${e.title}</h3><p>${e.desc}</p><div class="job-meta" style="margin-top:9px"><span>◷ ${e.time}</span><span>⌖ ${e.place}</span></div><div style="margin-top:9px"><span class="pill blue">${e.type}</span></div></div></div><button class="btn" onclick="joinEvent(${i})">${e.joined?'✓ Inscrito':'Inscribirme'}</button></div>`).join('')}</div><div class="card section-gap"><div class="card-title"><h3>Participación en actividades</h3><small>Indicadores simulados</small></div><div class="grid three-col"><div class="info-card"><h3>320</h3><p>Inscripciones en eventos del año</p></div><div class="info-card"><h3>76%</h3><p>Asistencia sobre inscritos</p></div><div class="info-card"><h3>4,7 / 5</h3><p>Calificación promedio de actividades</p></div></div></div>`,
jobs:()=>`${pageHead('OPORTUNIDADES','Bolsa de empleo','Vacantes compartidas para conectar empresas con el talento egresado.','<button class="btn primary" onclick="openJobForm()">＋ Publicar vacante</button>')}<div class="toolbar"><div class="filters"><input id="jobSearch" placeholder="Buscar cargo o empresa..." oninput="renderJobs()"><select id="jobArea" onchange="renderJobs()"><option value="">Todas las áreas</option><option>Tecnología</option><option>Educación</option><option>Administración</option><option>Diseño</option><option>Sector público</option></select><select id="jobMode" onchange="renderJobs()"><option value="">Modalidad</option><option>Presencial</option><option>Híbrido</option><option>Remoto</option></select></div><span class="pill blue">6 vacantes de muestra</span></div><div class="grid two-col" id="jobCards">${jobOffers.map(jobCard).join('')}</div><div class="footer-note">Las vacantes son ficticias y no corresponden a procesos de selección reales.</div>`,

admins:()=>`${pageHead('CONTROL DE ACCESO','Administradores y permisos','Gestiona los perfiles que pueden operar los módulos institucionales.','<button class="btn primary" onclick="openAdminForm()">＋ Agregar administrador</button>')}<div class="card"><div class="card-title"><h3>Usuarios con permisos administrativos</h3><span class="pill blue">${adminsList.length} usuarios demo</span></div><div class="table-wrap" style="border:0"><table><thead><tr><th>USUARIO</th><th>CORREO</th><th>ROL</th><th>ESTADO</th><th>ÚLTIMO ACCESO</th><th></th></tr></thead><tbody>${adminsList.map((x,i)=>`<tr><td><div class="person">${avatar(x[0])}<b>${x[0]}</b></div></td><td>${x[1]}</td><td>${x[2]}</td><td><span class="pill ${x[3]==='Activo'?'':'amber'}">${x[3]}</span></td><td>${x[4]}</td><td><button class="table-action" onclick="toggleAdmin(${i})">${i?(x[3]==='Activo'?'Suspender':'Activar'):'Principal'}</button></td></tr>`).join('')}</tbody></table></div></div><div class="grid three-col section-gap"><div class="card info-card"><h3>Superadministrador</h3><p>Acceso completo a configuración, usuarios, roles y todos los módulos.</p></div><div class="card info-card"><h3>Administrador</h3><p>Gestiona egresados, encuestas, eventos, vacantes e informes.</p></div><div class="card info-card"><h3>Consulta</h3><p>Puede consultar información autorizada sin modificar registros.</p></div></div>`,
settings:()=>`${pageHead('SISTEMA','Configuración de la plataforma','Ajustes generales de la institución y de la experiencia de demostración.','<button class="btn" onclick="resetDemo()">↺ Restablecer demo</button><button class="btn primary" onclick="saveSettings()">Guardar cambios</button>')}<div class="grid two-col"><div class="card"><div class="card-title"><h3>Identidad institucional</h3></div><div class="form-grid"><div class="field full"><label>Nombre de la institución</label><input id="sName" value="${cfg.name}"></div><div class="field"><label>Ciudad</label><input id="sCity" value="${cfg.city}"></div><div class="field"><label>Año de fundación</label><input value="1985"></div><div class="field full"><label>Correo de contacto</label><input id="sMail" value="${cfg.mail}"></div><div class="field full"><label>Descripción</label><textarea>Comunidad institucional para mantener el vínculo con nuestros egresados.</textarea></div></div></div><div class="card"><div class="card-title"><h3>Preferencias y privacidad</h3></div><div class="mini-list"><div class="mini-row"><div><b>Directorio visible para egresados</b><small>Permite consultar perfiles con autorización.</small></div><span class="pill amber">Demo</span></div><div class="mini-row"><div><b>Notificaciones por correo</b><small>Recordatorios y novedades institucionales.</small></div><span class="pill gray">Simulado</span></div><div class="mini-row"><div><b>Verificación de perfiles</b><small>Revisión administrativa de registros.</small></div><span class="pill">Activada</span></div><div class="mini-row"><div><b>Exportación de datos</b><small>Disponible para roles autorizados.</small></div><span class="pill">Activada</span></div></div></div></div><div class="card section-gap"><div class="card-title"><h3>Estado de la demo</h3><span class="pill amber">Sin backend</span></div><div class="grid three-col"><div class="info-card"><h3>Base de datos</h3><p>Datos de muestra incluidos en el navegador. No hay conexión con una base institucional.</p></div><div class="info-card"><h3>Autenticación</h3><p>La sesión es ilustrativa. No se validan contraseñas ni identidades reales.</p></div><div class="info-card"><h3>Privacidad</h3><p>Usa únicamente datos ficticios. Para producción se requiere autorización y controles reales.</p></div></div></div>`
};
function jobCard(j){return `<div class="card job-card"><div style="display:flex;justify-content:space-between;gap:8px"><div><h3>${j.title}</h3><p>${j.company}</p></div><span class="pill blue">${j.area}</span></div><div class="job-meta"><span>⌖ ${j.city}</span><span>◫ ${j.mode}</span><span>▤ ${j.type}</span></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><small style="color:var(--muted);font-size:9px">${j.date}</small><button class="btn" onclick="toggleJob(${jobOffers.indexOf(j)})">${j.saved?'✓ Guardada':'Guardar vacante'}</button></div></div>`}
function renderJobs(){let q=(document.getElementById('jobSearch')?.value||'').toLowerCase(),area=document.getElementById('jobArea')?.value||'',mode=document.getElementById('jobMode')?.value||'';let list=jobOffers.filter(j=>(j.title+j.company).toLowerCase().includes(q)&&(!area||j.area===area)&&(!mode||j.mode===mode));document.getElementById('jobCards').innerHTML=list.length?list.map(jobCard).join(''):'<div class="card empty">No se encontraron vacantes con esos filtros.</div>'}
function renderAlumniTable(){let q=(document.getElementById('alumniSearch')?.value||'').toLowerCase(),year=document.getElementById('yearFilter')?.value||'',status=document.getElementById('statusFilter')?.value||'';let list=alumni.filter(a=>(a.name+a.email+a.program+a.company).toLowerCase().includes(q)&&(!year||String(a.year)===year)&&(!status||a.status===status)&&(!(document.getElementById('programFilter')?.value)||a.program===document.getElementById('programFilter').value));document.getElementById('alumniRows').innerHTML=list.length?list.map(a=>`<tr><td><div class="person">${avatar(a.name)}<div><b>${a.name}</b><small>${a.email}</small></div></div></td><td>${a.year}</td><td>${a.program}</td><td>${a.city}</td><td><span class="pill ${a.status==='Activo'?'':'amber'}">${a.status}</span></td><td>${a.lastUpdate}</td><td><button class="table-action" onclick="viewAlumni(${a.id})">Ver perfil →</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">No se encontraron egresados.</td></tr>';document.getElementById('alumniCount').textContent=`Mostrando ${list.length} de ${alumni.length} egresados ficticios`;}
function renderEmploymentTable(){document.getElementById('employmentRows').innerHTML=alumni.slice(0,12).map(a=>`<tr><td>${a.name}</td><td>${a.position}</td><td>${a.company}</td><td>${a.sector}</td><td>${a.salary}</td></tr>`).join('')}
function navigate(p){currentPage=p;render();document.getElementById('sidebar').classList.remove('open');window.scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
document.getElementById('menuToggle').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){navigate('alumni');document.getElementById('alumniSearch').value=e.target.value;renderAlumniTable()}});
function viewAlumni(id){selectedAlumni=alumni.find(a=>a.id===id);navigate('profile')}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
function openModal(title,body,submitLabel='Guardar',onSubmit=()=>{}){document.getElementById('modal').innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">✕</button></div>${body}<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="modalSubmit">${submitLabel}</button></div>`;document.getElementById('modalBackdrop').classList.add('show');document.getElementById('modalSubmit').onclick=onSubmit}
function openAlumniForm(){openModal('Registrar nuevo egresado',`<div class="form-grid"><div class="field"><label>Nombre completo</label><input id="fName" placeholder="Nombre y apellidos"></div><div class="field"><label>Año de graduación</label><select id="fYear">${years.map(y=>`<option>${y}</option>`).join('')}</select></div><div class="field"><label>Correo electrónico</label><input id="fEmail" placeholder="correo@ejemplo.com"></div><div class="field"><label>Teléfono</label><input id="fPhone" placeholder="+57"></div><div class="field"><label>Programa</label><select id="fProgram">${careers.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Ciudad</label><select id="fCity">${cities.map(x=>`<option>${x}</option>`).join('')}</select></div></div>`,`Crear registro`,()=>{let name=document.getElementById('fName').value.trim();if(!name){toast('Escribe el nombre del egresado');return}let a={id:1001+alumni.length,name,initials:initials(name),email:document.getElementById('fEmail').value||'sin-correo@demo.com',phone:document.getElementById('fPhone').value||'No registrado',year:+document.getElementById('fYear').value,program:document.getElementById('fProgram').value,city:document.getElementById('fCity').value,company:'Por actualizar',position:'Por actualizar',status:'Pendiente de actualización',sector:'Sin clasificar',lastUpdate:'Hoy',cityWork:'Por definir',salary:'Sin dato',study:'Ninguno',about:'Perfil agregado en la demostración.'};a.exp=[];a.edu=[];a.history=[{date:'Hoy',text:'Registro creado por el administrador'}];alumni.unshift(a);closeModal();navigate('alumni');toast('Egresado agregado a la demo')})}
function openEditProfile(){openModal('Editar mi información',`<div class="form-grid"><div class="field full"><label>Nombre</label><input value="${selectedAlumni.name}" disabled></div><div class="field"><label>Correo</label><input id="eEmail" value="${selectedAlumni.email}"></div><div class="field"><label>Teléfono</label><input id="ePhone" value="${selectedAlumni.phone}"></div><div class="field"><label>Ciudad</label><select id="eCity">${cities.map(c=>`<option ${c===selectedAlumni.city?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Cargo actual</label><input id="ePosition" value="${selectedAlumni.position}"></div><div class="field full"><label>Resumen profesional</label><textarea id="eAbout">${selectedAlumni.about}</textarea></div></div>`,`Guardar perfil`,()=>{let _o=JSON.stringify([selectedAlumni.email,selectedAlumni.phone,selectedAlumni.city,selectedAlumni.position,selectedAlumni.about]);selectedAlumni.email=document.getElementById('eEmail').value;selectedAlumni.phone=document.getElementById('ePhone').value;selectedAlumni.city=document.getElementById('eCity').value;selectedAlumni.position=document.getElementById('ePosition').value;selectedAlumni.about=document.getElementById('eAbout').value;if(_o!==JSON.stringify([selectedAlumni.email,selectedAlumni.phone,selectedAlumni.city,selectedAlumni.position,selectedAlumni.about]))logChange(selectedAlumni,'Actualizó datos de contacto o resumen profesional');closeModal();render();toast('Perfil actualizado en esta sesión demo')})}
function openSurveyForm(){openModal('Crear encuesta',`<div class="form-grid"><div class="field full"><label>Título de la encuesta</label><input id="sTitle" placeholder="Ej. Seguimiento de egresados 2027"></div><div class="field full"><label>Descripción</label><textarea id="sDesc" placeholder="¿Qué información deseas conocer?"></textarea></div><div class="field"><label>Fecha de cierre</label><input type="date" id="sDate"></div><div class="field"><label>Público objetivo</label><select><option>Todos los egresados</option><option>Una promoción específica</option><option>Egresados sin empleo</option></select></div></div>`,`Crear encuesta`,()=>{let title=document.getElementById('sTitle').value.trim();if(!title){toast('Agrega un título');return}surveys.unshift({title,desc:document.getElementById('sDesc').value||'Encuesta institucional de demostración.',responses:0,total:420,state:'Activa',date:document.getElementById('sDate').value||'Sin definir'});closeModal();render();toast('Encuesta creada en la demo')})}
function openEventForm(){openModal('Crear evento',`<div class="form-grid"><div class="field full"><label>Nombre del evento</label><input id="evTitle" placeholder="Nombre del encuentro"></div><div class="field"><label>Fecha</label><input id="evDate" type="date"></div><div class="field"><label>Hora</label><input id="evTime" type="time"></div><div class="field"><label>Modalidad</label><select id="evType"><option>Presencial</option><option>Virtual</option><option>Híbrido</option></select></div><div class="field"><label>Lugar o enlace</label><input id="evPlace" placeholder="Lugar del evento"></div><div class="field full"><label>Descripción</label><textarea id="evDesc"></textarea></div></div>`,`Crear evento`,()=>{let title=document.getElementById('evTitle').value.trim();if(!title){toast('Escribe el nombre del evento');return}let d=document.getElementById('evDate').value;let date=d?new Date(d+'T12:00:00'):new Date();events.push({day:String(date.getDate()).padStart(2,'0'),month:date.toLocaleString('es',{month:'short'}).toUpperCase(),title,type:document.getElementById('evType').value,place:document.getElementById('evPlace').value||'Por definir',time:document.getElementById('evTime').value||'Por definir',desc:document.getElementById('evDesc').value||'Evento institucional.'});closeModal();render();toast('Evento agregado a la demo')})}
function openJobForm(){openModal('Publicar oportunidad laboral',`<div class="form-grid"><div class="field full"><label>Nombre del cargo</label><input id="jTitle" placeholder="Cargo o vacante"></div><div class="field"><label>Empresa</label><input id="jCompany" placeholder="Nombre de la empresa"></div><div class="field"><label>Ciudad</label><input id="jCity" placeholder="Ciudad o remoto"></div><div class="field"><label>Área</label><select id="jArea"><option>Tecnología</option><option>Educación</option><option>Administración</option><option>Diseño</option><option>Sector público</option><option>Salud</option></select></div><div class="field"><label>Modalidad</label><select id="jMode"><option>Presencial</option><option>Híbrido</option><option>Remoto</option></select></div><div class="field full"><label>Tipo de contrato</label><input id="jType" value="Tiempo completo"></div></div>`,`Publicar vacante`,()=>{let title=document.getElementById('jTitle').value.trim();if(!title){toast('Escribe el nombre del cargo');return}jobOffers.unshift({title,company:document.getElementById('jCompany').value||'Empresa por confirmar',city:document.getElementById('jCity').value||'Por definir',mode:document.getElementById('jMode').value,type:document.getElementById('jType').value,date:'Hoy',area:document.getElementById('jArea').value});closeModal();render();toast('Vacante publicada en la demo')})}
function openAdminForm(){openModal('Agregar administrador',`<div class="form-grid"><div class="field full"><label>Nombre completo</label><input id="adName" placeholder="Nombre"></div><div class="field full"><label>Correo institucional</label><input id="adEmail" placeholder="usuario@institucion.edu.co"></div><div class="field full"><label>Rol</label><select id="adRole"><option>Administrador</option><option>Gestor de seguimiento</option><option>Consulta de informes</option></select></div></div>`,`Agregar usuario`,()=>{let n=document.getElementById('adName').value.trim();if(!n){toast('Completa el nombre');return}adminsList.push([n,document.getElementById('adEmail').value||'sin-correo@demo.edu.co',document.getElementById('adRole').value,'Invitado','Sin acceso']);closeModal();render();toast('Usuario de muestra agregado (sin acceso real)')})}
function exportCSV(){let rows=[['ID','Nombre','Correo','Teléfono','Año graduación','Programa','Ciudad','Empresa','Cargo','Estado'],...alumni.map(a=>[a.id,a.name,a.email,a.phone,a.year,a.program,a.city,a.company,a.position,a.status])];let csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='egresados_demo.csv';a.click();URL.revokeObjectURL(url);toast('Archivo CSV descargado')}
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});

const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cfg={name:'Institución Educativa Demo',city:'Manizales, Caldas',mail:'egresados@institucion-demo.edu.co'};
const adminsList=[['Administrador Demo','admin@demo.edu.co','Superadministrador','Activo','Hoy, 9:14 a. m.'],['Laura Méndez','laura.mendez@demo.edu.co','Administrador','Activo','Ayer, 3:42 p. m.'],['Carlos Rojas','carlos.rojas@demo.edu.co','Gestor de seguimiento','Activo','30 oct 2026'],['Sofía Marín','sofia.marin@demo.edu.co','Consulta de informes','Invitado','28 oct 2026']];
function ensure(a){if(!a.exp){a.exp=[{role:a.position,org:a.company,from:2024,to:'Actualidad',city:a.cityWork,desc:'Desarrollo de actividades propias del cargo y trabajo colaborativo.'},{role:'Practicante / auxiliar',org:'Organización de práctica',from:2023,to:2024,city:a.city,desc:'Apoyo en procesos del área y proyectos de formación.'}];let e=y=>y>2026?'En curso':y;a.edu=[{title:a.program,org:'Institución de educación superior',type:'Pregrado',from:a.year+1,to:e(a.year+5)}];if(a.study!=='Ninguno')a.edu.push({title:a.study,org:'Entidad formadora (demo)',type:a.study,from:a.year+5,to:e(a.year+6)});a.history=[{date:a.lastUpdate,text:'Perfil verificado por la institución'},{date:String(a.year),text:'Egreso institucional · Promoción '+a.year}]}return a}
function logChange(a,text){ensure(a).history.unshift({date:new Date().toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'}),text});a.lastUpdate='Hoy'}
const emptyMsg=t=>`<p class="empty">${t}</p>`;
function expHTML(a){let l=ensure(a).exp;return l.length?l.map(x=>`<div class="timeline-item"><b>${esc(x.role)} · ${esc(x.org)}</b><small>${x.from} – ${x.to}${x.city?' · '+esc(x.city):''}</small><p>${esc(x.desc||'')}</p></div>`).join(''):emptyMsg('Aún no hay experiencia registrada.')}
function eduHTML(a){let l=ensure(a).edu;return(l.length?l.map(x=>`<div class="timeline-item"><b>${esc(x.title)}</b><small>${esc(x.org)} · ${x.type} · ${x.from} – ${x.to}</small></div>`).join(''):emptyMsg('Aún no hay estudios registrados.'))+`<div class="timeline-item"><b>Bachiller académico</b><small>Institución Educativa Demo · Graduación ${a.year}</small></div>`}
function histHTML(a){return ensure(a).history.map(h=>`<div class="timeline-item"><b>${esc(h.text)}</b><small>${h.date}</small></div>`).join('')}
const F=(id,l,x='',full='')=>`<div class="field ${full}"><label>${l}</label>${x||`<input id="${id}">`}</div>`;
const gv=i=>document.getElementById(i).value.trim();
function openExpForm(){openModal('Agregar experiencia laboral',`<div class="form-grid">${F('xRole','Cargo','','full')}${F('xOrg','Empresa o institución')}${F('xCity','Ciudad')}${F('xFrom','Año de inicio','<input id="xFrom" type="number" min="1990" max="2030" value="2026">')}${F('xTo','Año de fin (vacío = actualidad)','<input id="xTo" type="number" min="1990" max="2030">')}${F('xDesc','Descripción','<textarea id="xDesc"></textarea>','full')}</div>`,'Guardar experiencia',()=>{let a=ensure(selectedAlumni);if(!gv('xRole')||!gv('xOrg')){toast('Completa cargo y empresa');return}let cur=!gv('xTo');if(cur){a.exp.forEach(x=>{if(x.to==='Actualidad')x.to=gv('xFrom')||'—'});a.position=gv('xRole');a.company=gv('xOrg');a.cityWork=gv('xCity')||a.cityWork;a.status='Activo'}a.exp.unshift({role:gv('xRole'),org:gv('xOrg'),city:gv('xCity'),from:gv('xFrom')||'—',to:cur?'Actualidad':gv('xTo'),desc:gv('xDesc')});logChange(a,'Agregó experiencia: '+gv('xRole')+' en '+gv('xOrg'));closeModal();render();toast('Experiencia agregada al perfil')})}
function openEduForm(){openModal('Agregar estudio o certificación',`<div class="form-grid">${F('eTitle','Título o programa','','full')}${F('eOrg','Institución')}${F('eType','Tipo','<select id="eType">'+['Técnico','Tecnológico','Pregrado','Especialización','Maestría','Doctorado','Diplomado','Certificación','Curso'].map(t=>`<option>${t}</option>`).join('')+'</select>')}${F('eFrom','Año de inicio','<input id="eFrom" type="number" min="1990" max="2035" value="2026">')}${F('eTo','Año de fin (vacío = en curso)','<input id="eTo" type="number" min="1990" max="2035">')}</div>`,'Guardar estudio',()=>{let a=ensure(selectedAlumni);if(!gv('eTitle')){toast('Escribe el título o programa');return}a.edu.unshift({title:gv('eTitle'),org:gv('eOrg')||'Institución por definir',type:gv('eType'),from:gv('eFrom')||'—',to:gv('eTo')||'En curso'});if(['Especialización','Maestría','Doctorado','Diplomado'].includes(gv('eType')))a.study=gv('eType');logChange(a,'Agregó formación: '+gv('eTitle')+' ('+gv('eType')+')');closeModal();render();toast('Estudio agregado al perfil')})}
function promoCard(){return `<div class="card section-gap"><div class="card-title"><h3>Seguimiento por promoción</h3><small>Calculado con los ${alumni.length} perfiles de muestra</small></div><div class="table-wrap" style="border:0"><table><thead><tr><th>PROMOCIÓN</th><th>EGRESADOS</th><th>PERFILES ACTIVOS</th><th>FORMACIÓN ADICIONAL</th><th>CON EMPLEO ACTUAL</th><th></th></tr></thead><tbody>${years.map(y=>{let l=alumni.filter(a=>a.year===y),n=l.length,pc=k=>n?Math.round(k/n*100)+'%':'—';return `<tr><td><b>${y}</b></td><td>${n}</td><td>${pc(l.filter(a=>a.status==='Activo').length)}</td><td>${pc(l.filter(a=>a.study!=='Ninguno').length)}</td><td>${pc(l.filter(a=>!/búsqueda|actualizar/i.test(a.position)).length)}</td><td><button class="table-action" onclick="goYear(${y})">Ver egresados →</button></td></tr>`}).join('')}</tbody></table></div></div>`}
function goYear(y){navigate('alumni');document.getElementById('yearFilter').value=String(y);renderAlumniTable()}
function toggleAdmin(i){if(!i){toast('El superadministrador no se puede suspender');return}let x=adminsList[i];x[3]=x[3]==='Activo'?'Suspendido':'Activo';render();toast('Estado actualizado (demo, sin acceso real)')}
function joinEvent(i){let e=events[i];e.joined=!e.joined;render();toast(e.joined?'Inscripción registrada (demo, no se envía correo)':'Inscripción cancelada')}
function toggleJob(i){let j=jobOffers[i];j.saved=!j.saved;renderJobs();saveState();toast(j.saved?'Vacante guardada en tu lista (demo)':'Vacante quitada de tu lista')}
function surveyResults(i){let s=surveys[i],b=Math.round(s.responses/s.total*100);openModal(esc(s.title),`<p style="font-size:11px;color:var(--muted)">${s.responses} respuestas de ${s.total} invitados (${b}%). Distribución por promoción simulada; no proviene de un servidor.</p>${years.map(y=>{let v=Math.max(5,Math.min(98,b+(y*7)%19-9));return `<div style="margin:10px 0"><div class="progress-meta"><b>Promoción ${y}</b><span>${v}%</span></div><div class="progress"><i style="width:${v}%"></i></div></div>`}).join('')}`,'Cerrar',closeModal)}
function applyCfg(){let b=document.querySelector('.brand small');if(b)b.textContent=cfg.name.toUpperCase();document.title='Egresados Conectados · '+cfg.name}
function saveSettings(){if(!gv('sName')){toast('Escribe el nombre de la institución');return}cfg.name=gv('sName');cfg.city=gv('sCity');cfg.mail=gv('sMail');applyCfg();saveState();toast('Configuración guardada en esta sesión (sin servidor)')}
const KEY='ec_demo_v2';
function saveState(){try{sessionStorage.setItem(KEY,JSON.stringify({alumni,surveys,events,jobOffers,adminsList,cfg,sel:selectedAlumni.id,page:currentPage}))}catch(e){}}
function resetDemo(){try{sessionStorage.removeItem(KEY)}catch(e){}location.reload()}
try{let st=JSON.parse(sessionStorage.getItem(KEY)||'null');if(st){alumni.splice(0,alumni.length,...st.alumni);surveys.splice(0,surveys.length,...st.surveys);events.splice(0,events.length,...st.events);jobOffers.splice(0,jobOffers.length,...st.jobOffers);adminsList.splice(0,adminsList.length,...st.adminsList);Object.assign(cfg,st.cfg);selectedAlumni=alumni.find(a=>a.id===st.sel)||alumni[0];currentPage=titles[st.page]?st.page:'dashboard'}}catch(e){}
applyCfg();
render();
</script>
</body></html>
